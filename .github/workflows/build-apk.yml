name: Build ZZZ Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract launcher project
        shell: bash
        run: |
          set -e

          echo "Looking for launcher ZIP..."

          ZIP=""

          for name in \
            "ZZZLauncher_UI_v1_1_Full_Build.zip" \
            "ZZZLauncher_UI_v1_1.zip" \
            "ZZZLauncher_Android_Project.zip"
          do
            if [ -f "$name" ]; then
              ZIP="$name"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "No launcher ZIP found in repository root."
            echo "Files currently in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          if [ -d "project/ZZZLauncher" ]; then
            cp -r project/ZZZLauncher/. ./
          else
            cp -r project/. ./
          fi

          rm -rf project

          echo "Project extracted successfully."
          echo "Gradle files:"
          ls -la
          ls -la app

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZZZLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
