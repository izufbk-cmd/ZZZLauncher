name: Build ZZZ Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest launcher ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name 'ZZZLauncher*.zip' ! -name 'build-apk*' | sort -r | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZZZLauncher ZIP found in repository root."
            find . -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Using: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project

          if [ -d "project/ZZZLauncher" ]; then
            cp -r project/ZZZLauncher/. ./
          else
            cp -r project/. ./
          fi

          rm -rf project

          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          echo "Project extracted successfully."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install             "platform-tools"             "platforms;android-36"             "build-tools;35.0.0"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZZZLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
