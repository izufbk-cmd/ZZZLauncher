name: Build ZZZ Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          echo "=== ZIP files in repository ==="
          find . -maxdepth 2 -type f -iname "*.zip" -print

          ZIP=$(find . -maxdepth 2 -type f -name 'ZZZLauncher_UI_v1_1_Full_Build.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZZZLauncher_UI_v1_1_Full_Build.zip was not found."
            echo "Please upload ZZZLauncher_UI_v1_1_Full_Build.zip to the repository root."
            exit 1
          fi

          echo "Using: $ZIP"

          mkdir -
